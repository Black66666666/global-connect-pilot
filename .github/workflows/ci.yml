name: Global Connect CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate plugin package
        run: npm run check:plugin

      - name: Cloudflare Worker dry-run build
        run: npm run check:build

      - name: Capture OpenAI challenge curl evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo '=== COMMAND 1: headers ==='
          curl -sS -D- https://global-connect.specforge.ru/.well-known/openai-apps-challenge -o /dev/null
          echo '=== COMMAND 2: raw body via sed -n l ==='
          curl -sS https://global-connect.specforge.ru/.well-known/openai-apps-challenge | sed -n 'l'
          echo '=== REDIRECT CHECK ==='
          curl -sS -o /dev/null -w 'http_code=%{http_code}\nredirect_url=%{redirect_url}\nnum_redirects=%{num_redirects}\n' https://global-connect.specforge.ru/.well-known/openai-apps-challenge
          echo '=== BYTE COUNT ==='
          curl -sS https://global-connect.specforge.ru/.well-known/openai-apps-challenge | wc -c

      - name: Wait for Cloudflare deployment and smoke-test custom-domain MCP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/remote-smoke.mjs
        env:
          GC_BASE_URL: https://global-connect.specforge.ru
          GC_EXPECTED_VERSION: 0.4.2
          GC_OPENAI_CHALLENGE: gt8yqWFuuBumU8UBQ1EoSHsZAo8e4cqeU5sruHohKh8
